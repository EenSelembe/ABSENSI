<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Absensi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:white;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#151515;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.card p{
    margin:5px 0;
    color:#ccc;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:8px;
    background:#198754;
    color:white;
    font-size:12px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

button{
    padding:10px;
    border:none;
    border-radius:8px;
    background:#dc3545;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <h1>DATA ABSENSI</h1>
    <button onclick="logout()">LOGOUT</button>
</div>

<div id="listAbsensi"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { 
    getAuth, 
    signOut, 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import { 
    getFirestore, 
    collection, 
    getDocs, 
    query, 
    orderBy,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDGArMeFqbZ95XXbdQV_7IDUzfii9k2HG0",
    authDomain: "absensi-2fed9.firebaseapp.com",
    projectId: "absensi-2fed9",
    storageBucket: "absensi-2fed9.appspot.com",
    messagingSenderId: "967198693925",
    appId: "1:967198693925:web:ad0445a7451d9afe2c7dcc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* PROTEKSI LOGIN */
onAuthStateChanged(auth,(user)=>{
    if(!user){
        window.location.href = "index.html";
    }
});

/* LOGOUT */
window.logout = async function(){
    await signOut(auth);
    window.location.href = "index.html";
}

/* FORMAT JAM HH:MM */
function formatJam(iso){

    if(!iso) return "-";

    return new Date(iso).toLocaleTimeString("id-ID",{
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
    });
}

/* HAPUS DATA */
window.hapusAbsensi = async function(id){

    if(!confirm("Hapus data ini?")) return;

    await deleteDoc(doc(db,"absensi",id));

    loadData();
}

/* LOAD DATA */
async function loadData(){

    const container = document.getElementById("listAbsensi");
    container.innerHTML = "Loading...";

    const q = query(collection(db,"absensi"), orderBy("tanggal","desc"));
    const snap = await getDocs(q);

    container.innerHTML = "";

    snap.forEach(d=>{

        let data = d.data();

        container.innerHTML += `
            <div class="card">

                <p><b>Nama:</b> ${data.nama || "-"}</p>

                <p><b>Tanggal:</b> ${data.tanggal || "-"}</p>

                <p><b>Jam Masuk:</b> ${formatJam(data.jamMasuk)}</p>

                <p><b>Jam Pulang:</b> ${formatJam(data.jamPulang)}</p>

                <p><b>Lama Kerja:</b> 
                    <span class="badge">${data.totalKerja || "-"}</span>
                </p>

                <p><b>Lokasi Masuk:</b> ${data.lokasiMasuk || "-"}</p>

                <p><b>Lokasi Pulang:</b> ${data.lokasiPulang || "-"}</p>

                <button onclick="hapusAbsensi('${d.id}')">
                    HAPUS
                </button>

            </div>
        `;
    });
}

loadData();

</script>

</body>
</html>
