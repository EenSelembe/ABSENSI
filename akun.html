<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin User Firebase</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#151515;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
    background:#222;
    color:white;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-add{
    background:#198754;
    color:white;
}

.btn-del{
    background:#dc3545;
    margin-top:5px;
}

.user{
    background:#222;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
    <h2>Tambah Akun</h2>

    <input type="text" id="nama" placeholder="Nama">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button class="btn-add" onclick="tambahUser()">TAMBAH</button>

    <div id="status"></div>
</div>

<div class="card">
    <h2>Daftar Akun</h2>
    <div id="listUser"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDGArMeFqbZ95XXbdQV_7IDUzfii9k2HG0",
    authDomain: "absensi-2fed9.firebaseapp.com",
    projectId: "absensi-2fed9",
    storageBucket: "absensi-2fed9.appspot.com",
    messagingSenderId: "967198693925",
    appId: "1:967198693925:web:ad0445a7451d9afe2c7dcc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* TAMBAH USER */
window.tambahUser = async function(){

    let nama = document.getElementById("nama").value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(!nama || !username || !password){
        alert("Lengkapi data");
        return;
    }

    await addDoc(collection(db,"users"),{
        nama,
        username,
        password,
        createdAt: new Date()
    });

    document.getElementById("status").innerText = "Akun berhasil dibuat";

    loadUser();
}

/* LOAD USER */
async function loadUser(){

    let list = document.getElementById("listUser");
    list.innerHTML = "Loading...";

    let snap = await getDocs(collection(db,"users"));

    list.innerHTML = "";

    snap.forEach((d)=>{

        let u = d.data();

        list.innerHTML += `
            <div class="user">

                <b>${u.nama}</b><br>
                Username: ${u.username}<br>

                <button class="btn-del" onclick="hapusUser('${d.id}')">
                    HAPUS
                </button>

            </div>
        `;
    });
}

/* HAPUS USER (FIREBASE) */
window.hapusUser = async function(id){

    if(confirm("Yakin hapus akun ini?")){

        await deleteDoc(doc(db,"users",id));

        loadUser();
    }
}

/* INIT */
loadUser();

</script>

</body>
</html>
