<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Absensi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:white;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#151515;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#198754;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#status{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>DASHBOARD ADMIN</h1>

<h2>Tambah Karyawan</h2>

<input type="text" id="nama" placeholder="Nama Lengkap">
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password Awal">

<button onclick="buatAkun()">BUAT AKUN</button>

<div id="status"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDGArMeFqbZ95XXbdQV_7IDUzfii9k2HG0",
    authDomain: "absensi-2fed9.firebaseapp.com",
    projectId: "absensi-2fed9",
    storageBucket: "absensi-2fed9.appspot.com",
    messagingSenderId: "967198693925",
    appId: "1:967198693925:web:ad0445a7451d9afe2c7dcc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.buatAkun = async function(){

    const nama = document.getElementById("nama").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const status = document.getElementById("status");

    if(!nama || !username || !password){
        status.innerHTML = "❌ Lengkapi semua data";
        return;
    }

    const email = username + "@spbu.tap";

    try {

        await createUserWithEmailAndPassword(auth, email, password);

        status.innerHTML = `
            ✅ Akun berhasil dibuat<br><br>
            Nama: ${nama}<br>
            Email: ${email}
        `;

        document.getElementById("nama").value = "";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";

    } catch(error){
        status.innerHTML = "❌ " + error.message;
    }
}

</script>

</body>
</html>
