<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Absensi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:white;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#151515;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#198754;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#status{
    margin-top:15px;
    text-align:center;
}

.user-item{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

.user-item p{
    margin:3px 0;
}

.btn-hapus{
    background:#dc3545;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>DASHBOARD ADMIN</h1>

        <h2>Tambah Karyawan</h2>

        <input
            type="text"
            id="nama"
            placeholder="Nama Lengkap">

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password Awal">

        <button onclick="buatAkun()">
            BUAT AKUN
        </button>

        <div id="status"></div>

    </div>

    <div class="card">

        <h2>Daftar Karyawan</h2>

        <div id="daftarUser"></div>

    </div>

</div>

<script>

let users = [];

function buatAkun(){

    const nama =
    document.getElementById("nama").value.trim();

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value.trim();

    if(
        nama === "" ||
        username === "" ||
        password === ""
    ){
        alert("Lengkapi semua data");
        return;
    }

    const email =
    username + "@spbu.tap";

    users.push({
        nama,
        username,
        email,
        password
    });

    document.getElementById("status").innerHTML = `
        ✅ Akun berhasil dibuat
        <br><br>
        Email: ${email}
    `;

    document.getElementById("nama").value = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

    tampilkanUser();

}

function tampilkanUser(){

    const daftar =
    document.getElementById("daftarUser");

    daftar.innerHTML = "";

    users.forEach((user,index)=>{

        daftar.innerHTML += `
            <div class="user-item">

                <p><b>${user.nama}</b></p>

                <p>
                    Username :
                    ${user.username}
                </p>

                <p>
                    Email :
                    ${user.email}
                </p>

                <button
                    class="btn-hapus"
                    onclick="hapusUser(${index})">
                    HAPUS
                </button>

            </div>
        `;

    });

}

function hapusUser(index){

    if(
        confirm(
            "Hapus akun ini?"
        )
    ){

        users.splice(index,1);

        tampilkanUser();

    }

}

</script>

</body>
</html>
