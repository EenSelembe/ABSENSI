<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi SPBU</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
}

.card{
    background:#151515;
    border-radius:15px;
    padding:25px;
    text-align:center;
}

h1{
    margin-bottom:15px;
}

.status-box{
    background:#222;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.status-title{
    color:#999;
    font-size:13px;
}

.status-text{
    font-size:18px;
    font-weight:bold;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.btn-absen{ background:#198754; color:white; }
.btn-ijin{ background:#ffc107; color:black; }
.btn-sakit{ background:#dc3545; color:white; }
.btn-logout{ background:#6c757d; color:white; }

#hasil{
    margin-top:15px;
    font-size:14px;
    color:#ddd;
}

.loader{
    width:40px;
    height:40px;
    border:4px solid #333;
    border-top:4px solid #00ff88;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>ABSENSI SPBU</h1>

<div class="status-box">
    <div class="status-title">Status</div>
    <div id="statusHari" class="status-text">Belum Absen</div>
</div>

<div class="status-box">
    <div class="status-title">Timer Kerja</div>
    <div id="timer" class="status-text">00:00:00</div>
</div>

<button class="btn-absen" id="btnAbsen" onclick="mulaiAbsen()">ABSEN MASUK</button>
<button class="btn-ijin">IJIN</button>
<button class="btn-sakit">SAKIT</button>
<button class="btn-logout" onclick="logout()">LOGOUT</button>

<div id="hasil"></div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import { getFirestore, doc, setDoc, updateDoc } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDGArMeFqbZ95XXbdQV_7IDUzfii9k2HG0",
    authDomain: "absensi-2fed9.firebaseapp.com",
    projectId: "absensi-2fed9",
    storageBucket: "absensi-2fed9.appspot.com",
    messagingSenderId: "967198693925",
    appId: "1:967198693925:web:ad0445a7451d9afe2c7dcc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userId = "";
let namaUser = "";

let startTime;
let elapsed = 0;
let timerInterval;
let statusAbsen = "masuk";

/* LOGIN CHECK */
onAuthStateChanged(auth,(user)=>{
    if(!user){
        window.location.href="index.html";
    }else{
        userId = user.uid;
        namaUser = user.email.split("@")[0];
    }
});

/* LOGOUT */
window.logout = async function(){
    await signOut(auth);
    window.location.href="index.html";
}

/* TIMER */
function startTimer(){
    startTime = Date.now() - elapsed;

    timerInterval = setInterval(()=>{
        elapsed = Date.now() - startTime;

        let sec = Math.floor(elapsed/1000);
        let h = Math.floor(sec/3600);
        let m = Math.floor((sec%3600)/60);
        let s = sec%60;

        document.getElementById("timer").innerText =
        String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');

    },1000);
}

function stopTimer(){
    clearInterval(timerInterval);
}

/* LOKASI SINGKAT */
function getLokasi(){
    return new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(async(pos)=>{

            let lat = pos.coords.latitude;
            let lng = pos.coords.longitude;

            let res = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
            );

            let data = await res.json();

            let full = data.display_name || "Lokasi tidak ditemukan";
            let parts = full.split(",");
            let singkat = parts.slice(0,3).join(",");

            resolve({
                nama: singkat
            });

        },reject);
    });
}

/* ABSEN MASUK */
async function absenMasuk(){

    let lokasi = await getLokasi();

    let now = new Date();
    let tanggal = now.toISOString().split("T")[0];
    let hari = now.toLocaleDateString("id-ID",{weekday:"long"});
    let jamMasuk = now.toTimeString().split(" ")[0];

    await setDoc(doc(db,"absensi",userId+"_"+tanggal),{
        nama:namaUser,
        tanggal:tanggal,
        hari:hari,
        jamMasuk:jamMasuk,
        lokasiMasuk:lokasi.nama
    });
}

/* ABSEN PULANG */
async function absenPulang(total){

    let lokasi = await getLokasi();

    let now = new Date();
    let tanggal = now.toISOString().split("T")[0];
    let jamPulang = now.toTimeString().split(" ")[0];

    await updateDoc(doc(db,"absensi",userId+"_"+tanggal),{
        jamPulang:jamPulang,
        totalKerja:total,
        lokasiPulang:lokasi.nama
    });
}

/* BUTTON ABSEN */
window.mulaiAbsen = async function(){

    document.getElementById("hasil").innerHTML =
    "<div class='loader'></div><p>Memproses...</p>";

    if(statusAbsen==="masuk"){

        await absenMasuk();

        startTimer();

        document.getElementById("statusHari").innerText="Sedang Bekerja";
        document.getElementById("btnAbsen").innerText="ABSEN PULANG";

        statusAbsen="pulang";

        document.getElementById("hasil").innerHTML="Absensi masuk berhasil";

    }else{

        stopTimer();

        let total = document.getElementById("timer").innerText;

        await absenPulang(total);

        document.getElementById("statusHari").innerText="Selesai";
        document.getElementById("btnAbsen").disabled=true;

        document.getElementById("hasil").innerHTML=
        "Absensi pulang berhasil. Total: "+total;
    }
}

</script>

</body>
</html>
