<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi SPBU</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#151515;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:420px;
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.btn-absen{background:#198754;color:white;}
.btn-logout{background:#dc3545;color:white;}

#timer{
    font-size:20px;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="card">

<h2>ABSENSI SPBU</h2>

<div id="status">Belum Absen</div>

<div id="timer">00:00</div>

<button id="btnAbsen" class="btn-absen" onclick="absen()">
ABSEN MASUK
</button>

<button id="btnLogout" class="btn-logout" onclick="logout()" disabled>
LOGOUT
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { 
    getAuth, 
    signOut, 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDGArMeFqbZ95XXbdQV_7IDUzfii9k2HG0",
    authDomain: "absensi-2fed9.firebaseapp.com",
    projectId: "absensi-2fed9",
    storageBucket: "absensi-2fed9.appspot.com",
    messagingSenderId: "967198693925",
    appId: "1:967198693925:web:ad0445a7451d9afe2c7dcc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let uid = "";
let status = "masuk";
let startTime = null;
let timer;

let isWorking = false;

/* LOGIN CHECK */
onAuthStateChanged(auth,(user)=>{
    if(!user){
        window.location.href = "index.html";
    }else{
        uid = user.uid;
        cekData();
    }
});

/* CEK DATA FIREBASE */
async function cekData(){

    let id = uid + "_" + new Date().toISOString().split("T")[0];

    let snap = await getDoc(doc(db,"absensi",id));

    if(snap.exists()){

        let data = snap.data();

        if(data.jamPulang){

            status = "selesai";
            document.getElementById("btnAbsen").disabled = true;
            document.getElementById("btnAbsen").innerText = "SELESAI";

        }else{

            status = "pulang";
            isWorking = true;

            document.getElementById("btnAbsen").innerText = "ABSEN PULANG";
            document.getElementById("btnLogout").disabled = true;

            startTimer(data.jamMasuk);
            lockPage();
        }
    }
}

/* TIMER */
function startTimer(start){

    startTime = new Date(start).getTime();

    timer = setInterval(()=>{

        let diff = Date.now() - startTime;

        let m = Math.floor(diff/60000);
        let h = Math.floor(m/60);
        m = m % 60;

        document.getElementById("timer").innerText =
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

    },1000);
}

/* ABSEN */
window.absen = async function(){

    let id = uid + "_" + new Date().toISOString().split("T")[0];

    if(status === "masuk"){

        await setDoc(doc(db,"absensi",id),{
            jamMasuk: new Date().toISOString()
        });

        status = "pulang";
        isWorking = true;

        document.getElementById("btnAbsen").innerText = "ABSEN PULANG";
        document.getElementById("btnLogout").disabled = true;

        startTimer(new Date().toISOString());

        lockPage();

    }else{

        await updateDoc(doc(db,"absensi",id),{
            jamPulang: new Date().toISOString()
        });

        status = "selesai";
        isWorking = false;

        clearInterval(timer);

        document.getElementById("btnAbsen").disabled = true;
        document.getElementById("btnAbsen").innerText = "SELESAI";

        document.getElementById("btnLogout").disabled = false;

        unlockPage();
    }
}

/* LOGOUT */
window.logout = async function(){

    if(isWorking){
        alert("Tidak bisa logout saat masih bekerja!");
        return;
    }

    await signOut(auth);
    window.location.href = "index.html";
}

/* BLOK BACK BUTTON */
history.pushState(null,null,location.href);

window.onpopstate = function(){
    history.pushState(null,null,location.href);
};

/* FORCE TETAP DI HALAMAN INI */
setInterval(()=>{
    if(isWorking){
        history.pushState(null,null,location.href);
    }
},1000);

/* LOCK PAGE */
function lockPage(){
    isWorking = true;
}

/* UNLOCK PAGE */
function unlockPage(){
    isWorking = false;
}

</script>

</body>
</html>
