<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi SPBU</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
}

.card{
    background:#151515;
    border-radius:15px;
    padding:25px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.status-box{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.status-title{
    color:#999;
    margin-bottom:5px;
}

.status-text{
    font-size:18px;
    font-weight:bold;
}

.info{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    color:#ccc;
    line-height:1.5;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.btn-absen{
    background:#198754;
    color:white;
}

.btn-ijin{
    background:#ffc107;
    color:black;
}

.btn-sakit{
    background:#dc3545;
    color:white;
}

#hasil{
    margin-top:20px;
}

.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.8);
    justify-content:center;
    align-items:center;
}

.popup-content{
    width:320px;
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.popup-content h3{
    margin-bottom:15px;
}

.popup-content p{
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:120px;
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:10px;
    resize:none;
    margin-bottom:15px;
}

.btn-yes{
    background:#198754;
    color:white;
}

.btn-no{
    background:#dc3545;
    color:white;
}

.loader{
    width:50px;
    height:50px;
    border:5px solid #333;
    border-top:5px solid #00ff88;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:15px auto;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>ABSENSI SPBU</h1>

<div class="status-box">
    <div class="status-title">
        Status Hari Ini
    </div>

    <div id="statusHari" class="status-text">
        ⚪ Belum Absen
    </div>
</div>

<div class="info">
    Pastikan Anda sudah berada di lokasi SPBU sebelum melakukan absensi.
</div>

<button
    id="btnAbsen"
    class="btn-absen"
    onclick="mulaiAbsen()">
    ABSEN MASUK
</button>

<button
    class="btn-ijin"
    onclick="bukaIjin()">
    IJIN
</button>

<button
    class="btn-sakit"
    onclick="bukaSakit()">
    SAKIT
</button>

<div id="hasil"></div>

</div>

</div>

<!-- POPUP ABSEN -->

<div id="popupAbsen" class="popup">

<div class="popup-content">

<h3 id="judulPopup">
ABSEN MASUK
</h3>

<p id="isiPopup">
Apakah Anda sudah berada di SPBU?
</p>

<button
    class="btn-yes"
    onclick="prosesAbsen()">
    YA
</button>

<button
    class="btn-no"
    onclick="tutupPopup()">
    BELUM
</button>

</div>

</div>

<!-- POPUP IJIN -->

<div id="popupIjin" class="popup">

<div class="popup-content">

<h3>KETERANGAN IJIN</h3>

<textarea
    id="ketIjin"
    placeholder="Tuliskan alasan ijin...">
</textarea>

<button
    class="btn-yes"
    onclick="kirimIjin()">
    KIRIM
</button>

<button
    class="btn-no"
    onclick="tutupIjin()">
    BATAL
</button>

</div>

</div>

<!-- POPUP SAKIT -->

<div id="popupSakit" class="popup">

<div class="popup-content">

<h3>KETERANGAN SAKIT</h3>

<textarea
    id="ketSakit"
    placeholder="Tuliskan keterangan sakit...">
</textarea>

<button
    class="btn-yes"
    onclick="kirimSakit()">
    KIRIM
</button>

<button
    class="btn-no"
    onclick="tutupSakit()">
    BATAL
</button>

</div>

</div>

<script>

let statusAbsen = "masuk";

function mulaiAbsen(){

    document.getElementById("popupAbsen").style.display =
    "flex";

    if(statusAbsen==="masuk"){

        document.getElementById("judulPopup").innerText =
        "ABSEN MASUK";

        document.getElementById("isiPopup").innerText =
        "Apakah Anda sudah berada di SPBU?";

    }else{

        document.getElementById("judulPopup").innerText =
        "ABSEN PULANG";

        document.getElementById("isiPopup").innerText =
        "Apakah Anda sudah selesai bekerja?";

    }

}

function tutupPopup(){

    document.getElementById("popupAbsen").style.display =
    "none";

}

function prosesAbsen(){

    document.getElementById("popupAbsen").style.display =
    "none";

    const hasil =
    document.getElementById("hasil");

    hasil.innerHTML = `
        <div class="loader"></div>
        <p>Memproses absensi...</p>
    `;

    setTimeout(()=>{

        if(statusAbsen==="masuk"){

            document.getElementById("statusHari").innerHTML =
            "🟢 Sedang Bekerja";

            document.getElementById("btnAbsen").innerText =
            "ABSEN PULANG";

            hasil.innerHTML = `
                <h3 style="color:#00ff88">
                    ✅ ABSEN MASUK BERHASIL
                </h3>
                <br>
                <p>
                    Silakan lakukan absen pulang saat selesai bekerja.
                </p>
            `;

            statusAbsen = "pulang";

        }else{

            document.getElementById("statusHari").innerHTML =
            "✅ Selesai";

            document.getElementById("btnAbsen").innerText =
            "ABSENSI SELESAI";

            document.getElementById("btnAbsen").disabled =
            true;

            document.getElementById("btnAbsen").style.background =
            "#555";

            hasil.innerHTML = `
                <h3 style="color:#00ff88">
                    ✅ ABSEN PULANG BERHASIL
                </h3>
                <br>
                <p>
                    Terima kasih. Selamat beristirahat.
                </p>
            `;

        }

    },3000);

}

function bukaIjin(){
    document.getElementById("popupIjin").style.display =
    "flex";
}

function tutupIjin(){
    document.getElementById("popupIjin").style.display =
    "none";
}

function kirimIjin(){

    const isi =
    document.getElementById("ketIjin").value.trim();

    if(isi===""){
        alert("Silakan isi keterangan ijin.");
        return;
    }

    tutupIjin();

    document.getElementById("hasil").innerHTML = `
        <div class="loader"></div>
        <p>Mengirim permohonan ijin...</p>
    `;

    setTimeout(()=>{

        document.getElementById("hasil").innerHTML = `
            <h3 style="color:#ffc107">
                📝 PERMOHONAN IJIN BERHASIL DIKIRIM
            </h3>
        `;

        document.getElementById("ketIjin").value = "";

    },3000);

}

function bukaSakit(){
    document.getElementById("popupSakit").style.display =
    "flex";
}

function tutupSakit(){
    document.getElementById("popupSakit").style.display =
    "none";
}

function kirimSakit(){

    const isi =
    document.getElementById("ketSakit").value.trim();

    if(isi===""){
        alert("Silakan isi keterangan sakit.");
        return;
    }

    tutupSakit();

    document.getElementById("hasil").innerHTML = `
        <div class="loader"></div>
        <p>Mengirim laporan sakit...</p>
    `;

    setTimeout(()=>{

        document.getElementById("hasil").innerHTML = `
            <h3 style="color:#ff6666">
                🤒 LAPORAN SAKIT BERHASIL DIKIRIM
            </h3>
        `;

        document.getElementById("ketSakit").value = "";

    },3000);

}

</script>

</body>
</html>
