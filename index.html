<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Absensi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    width:350px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#status{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>Login Absensi</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { 
    getAuth, 
    signInWithEmailAndPassword,
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "AIzaSyDGArMeFqbZ95XXbdQV_7IDUzfii9k2HG0",
    authDomain: "absensi-2fed9.firebaseapp.com",
    projectId: "absensi-2fed9",
    storageBucket: "absensi-2fed9.appspot.com",
    messagingSenderId: "967198693925",
    appId: "1:967198693925:web:ad0445a7451d9afe2c7dcc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN FUNCTION */
window.login = async function(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const status = document.getElementById("status");

    if(!email || !password){
        status.innerHTML = "❌ Email dan password wajib diisi";
        return;
    }

    try {

        await signInWithEmailAndPassword(auth, email, password);

        status.innerHTML = "✅ Login berhasil";

        setTimeout(()=>{

            // 🔥 ROLE CHECK ADMIN
            if(email === "admin@spbu.tap"){
                window.location.href = "dasboard.html";
            } else {
                window.location.href = "absen.html";
            }

        },1000);

    } catch(error){
        status.innerHTML = "❌ " + error.message;
    }
}

/* AUTO LOGIN */
onAuthStateChanged(auth,(user)=>{

    if(user){

        if(user.email === "admin@spbu.tap"){
            window.location.href = "dasboard.html";
        } else {
            window.location.href = "absen.html";
        }

    }

});

</script>

</body>
</html>
